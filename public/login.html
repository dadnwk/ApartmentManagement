<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="login.title">Login</title>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main>
  <div class="card login">
    <h2 data-i18n="app.title">Apartment Management</h2>
    <div class="tools">
      <select id="lang" aria-label="Language"></select>
      <button id="theme" class="secondary small" type="button"></button>
    </div>
    <form id="loginForm">
      <label><span data-i18n="login.username">Username</span><input name="username" autocomplete="username" required autofocus></label>
      <label><span data-i18n="login.password">Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="error" role="alert"></p>
      <button data-i18n="login.submit">Log in</button>
    </form>
  </div>
</main>
<script type="module" src="login.js"></script>
</body>
</html>
